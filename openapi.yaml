openapi: 3.0.4
info:
  title: SEO Data Scraper
  description: >-
    SEO Data Scraper parses any public URL to collect title tags, meta
    descriptions, robots directives, and Open Graph or Twitter card previews.
    Paid plans add canonical URLs to verify indexing rules.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/seoscraper:
    post:
      summary: SEO Data Scraper
      description: Scrape SEO data from a web page
      operationId: seoscraper
      parameters: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  url: https://apiverve.com
                  title: APIVerve — One key for 300+ production APIs
                  description: >-
                    Consistent schemas, predictable credit pricing, and an
                    uptime SLA on every paid plan across 300+ production APIs.
                    One key, one bill, zero glue code.
                  keywords: ''
                  author: ''
                  canonical: ''
                  og:title: APIVerve — One key for 300+ production APIs
                  og:description: >-
                    Consistent schemas, predictable credit pricing, and an
                    uptime SLA on every paid plan across 300+ production APIs.
                    One key, one bill, zero glue code.
                  og:image: https://apiverve.com/social-images/page-home.png
                  og:url: https://apiverve.com
                  og:type: website
                  og:site_name: APIVerve
                  twitter:card: summary_large_image
                  twitter:title: APIVerve — One key for 300+ production APIs
                  twitter:description: >-
                    Consistent schemas, predictable credit pricing, and an
                    uptime SLA on every paid plan across 300+ production APIs.
                  twitter:image: https://apiverve.com/social-images/page-home.png
                  twitter:site: ''
                  robots: ''
                  viewport: width=device-width, initial-scale=1, maximum-scale=1
                  charset: utf-8
                  titleRelevance: 47.91
                  descriptionRelevance: 51.65
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  description: The URL of the web page to scrape SEO data from
              required:
                - url
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
sampleRequest:
  url: https://apiverve.com
